[package]
name = "borrow"
version = "0.1.0"
edition = "2021"

# The two entry points, named rather than left to inference: CI, HANDOFF.md
# and the installers all say which binary they mean, and an installed desktop
# app called `app` is a poor neighbour in /usr/bin.
[[bin]]
name = "borrow"
path = "src/main.rs"

[[bin]]
name = "borrow-app"
path = "src/bin/app.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs"] }

# Remote services — the desktop's only network surface (auth, entitlement,
# sync) against the Convex backend. rustls rather than platform OpenSSL, so
# a release build needs no system TLS library; `url` builds the OAuth
# authorize links with proper percent-encoding instead of string gluing.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Desktop UI stack (the `app` branch only).
#
# gpui-kit is the single entry point: it brings gpui-component (widgets), the
# gpui asset source, and gpui-pre — Zed's gpui published as a pinned snapshot
# with Zed's licence intact. Go through gpui-kit's re-exports and nowhere else.
# Importing crates.io `gpui` directly gives you a different, incompatible type
# universe: same names, different `App`/`Window`, and errors that look like
# "expected `App`, found `App`".
#
# tree-sitter + tree-sitter-rust are the playground's Rust colouring: the
# grammar feeds both the highlighter and the editor's string/comment
# classification. Without them the editor still works, it just shows plain text.
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter",
    "tree-sitter-rust",
] }

# Headless UI tests: render real views and drive focus/keys with no window
# behind it. Dev-only so the shipped binary does not carry the test harness.
[dev-dependencies]
gpui-kit = { version = "0.7.1", features = [
    "test-support",
    "tree-sitter",
    "tree-sitter-rust",
] }

# Release artifacts only. The debug binary already runs to hundreds of
# megabytes, and tree-sitter added to it; an installer carrying an unstripped
# gpui build is measured the same way. `strip` takes most of the weight, thin
# LTO and a single codegen unit buy some of the build time back — a build that
# runs on tags, not on every save.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# ── Installers ────────────────────────────────────────────────────────────────
# `cargo packager` turns the desktop binary into what people actually install:
# deb + AppImage on Linux, dmg on macOS, NSIS on Windows. It never builds, so
# the hook below does. Run it per platform:
#
#     cargo packager --release --formats deb,appimage
#     cargo packager --release --formats dmg
#     cargo packager --release --formats nsis
#
# No `resources`: the fonts, the theme and the migrations are compiled into
# the binary, so there is no file tree to stage next to it.
[package.metadata.packager]
product-name = "BORROW_"
identifier = "com.gusdgoat.borrow"
publisher = "Gus-D-Goat"
authors = ["Gus-D-Goat"]
description = "Learn Rust without the 700-page detour."
homepage = "https://github.com/Gus-D-Goat/BORROW"
category = "Education"
copyright = "Copyright (c) 2026 Gus-D-Goat"
icons = ["assets/icon/borrow-512.png"]
binaries = [{ path = "borrow-app", main = true }]
out-dir = "target/bundle"
# `bash`, not `./…`: packager runs this through `cmd /C` on Windows and
# `sh -c` everywhere else, and `./tools/before-package.sh` is only valid in
# the second of those. Git Bash satisfies it on a Windows runner.
before-packaging-command = "bash tools/before-package.sh"

[package.metadata.packager.macos]
# gpui needs Metal and the modern text stack; anything older than Big Sur
# is not a target this binary was ever run on.
minimum-system-version = "11.0"

[package.metadata.packager.nsis]
# Per-user by default: no administrator prompt for an app that writes
# nothing outside its own directory and the user's data folder.
installer-mode = "currentUser"
# The same path `config::data_dir_for` computes, so the uninstaller can
# offer to take the progress database with it.
appdata-paths = ["$APPDATA/BORROW"]

# Every soname `ldd target/release/borrow-app` reports, mapped to its Debian
# package. Fonts and SQLite are inside the binary, so they are not here —
# this list is the whole dynamic surface of a gpui build on X11.
[package.metadata.packager.deb]
section = "education"
priority = "optional"
depends = [
    "libc6",
    "libgcc-s1",
    "libxau6",
    "libxcb1",
    "libxcb-xkb1",
    "libxdmcp6",
    "libxkbcommon0",
    "libxkbcommon-x11-0",
]

# The same set as sonames, for the AppImage to carry: an AppImage that
# assumes the host has the xkb stack is an AppImage that does not run.
# `excluded-libs` keeps linuxdeploy from re-processing them — it strips what
# it deploys, and its bundled `strip` predates the RELR sections modern
# distros ship, so an unexcluded copy fails with `unknown type [0x13]`.
[package.metadata.packager.appimage]
excluded-libraries = [
    "libXau*",
    "libXdmcp*",
    "libxcb*",
    "libxkbcommon*",
]
libs = [
    "libXau.so.6",
    "libxcb.so.1",
    "libxcb-xkb.so.1",
    "libXdmcp.so.6",
    "libxkbcommon.so.0",
    "libxkbcommon-x11.so.0",
]
