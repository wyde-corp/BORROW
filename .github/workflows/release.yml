name: release

# Phase 7 — a tag becomes installers.
#
# `app.yml` is the gate for every push; this runs on version tags (or by
# hand), builds in release mode, packages per platform, and attaches the
# artifacts plus their checksums to the GitHub release.
#
# Sign-in and billing are baked at compile time from repository variables
# (Settings → Secrets and variables → Actions → Variables):
# BORROW_CONVEX_SITE_URL, BORROW_GOOGLE_CLIENT_ID, BORROW_GITHUB_CLIENT_ID.
# The workflow refuses to build if any is missing — a tagged release must
# never ship with sign-in unconfigured.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      BORROW_CONVEX_SITE_URL: ${{ vars.BORROW_CONVEX_SITE_URL }}
      BORROW_GOOGLE_CLIENT_ID: ${{ vars.BORROW_GOOGLE_CLIENT_ID }}
      BORROW_GITHUB_CLIENT_ID: ${{ vars.BORROW_GITHUB_CLIENT_ID }}
    strategy:
      # One platform failing must not hide the others' artifacts.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: deb,appimage
          - os: macos-latest
            formats: dmg
          - os: windows-latest
            formats: nsis

    steps:
      - uses: actions/checkout@v4

      # The installer filenames and package metadata come from Cargo.toml, so
      # a tag that disagrees with it ships a release nobody can match back to
      # its version (and a .deb apt will never upgrade). Fail before the build.
      - name: Require the tag to match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version} — bump Cargo.toml or retag"
            exit 1
          fi

      # Fail before the long build, not after it.
      - name: Require baked sign-in configuration
        shell: bash
        run: |
          missing=0
          for v in BORROW_CONVEX_SITE_URL BORROW_GOOGLE_CLIENT_ID BORROW_GITHUB_CLIENT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is unset — add it as a repository variable before releasing"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config cmake \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev \
            libfontconfig1-dev fontconfig \
            libvulkan-dev \
            libsqlite3-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      # Both halves for the universal binary `tools/before-package.sh`
      # lipos together; native target first so a cache miss still leaves the
      # common case warm.
      - name: Add the macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}

      # `cargo install` reports "already installed" and does nothing when the
      # cache restored a matching binary, so this is seconds after the first run.
      - name: Cache cargo-packager
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-packager
          key: cargo-packager-${{ runner.os }}-0.11.8

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build both macOS halves
        if: runner.os == 'macOS'
        run: |
          cargo build --release --bin borrow-app --target aarch64-apple-darwin
          cargo build --release --bin borrow-app --target x86_64-apple-darwin

      - name: Package
        run: cargo packager --release --formats ${{ matrix.formats }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          # The bundle directory carries packager scratch files as well; take
          # only what a user would download.
          find target/bundle -maxdepth 1 -type f \
            \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" \
               -o -name "*.exe" -o -name "*.msi" \) \
            -exec cp {} artifacts/ \;
          ls -la artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error

  release:
    name: attach to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundle
          merge-multiple: true

      - name: Checksums
        working-directory: bundle
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: bundle/*
          generate_release_notes: true
          # `v0.1.0-rc.1` and friends are prereleases: the artifacts are there
          # to be tested, not recommended to anybody yet. Anything with a
          # hyphen in the tag counts — semver's rule, spelled out because
          # `auto` marked the first rc as a full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
